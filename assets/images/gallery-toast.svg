    </linearGradient>
    <linearGradient id="meat-gallery-toast" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#C9634C"/>
      <stop offset="0.45" stop-color="#A8352B"/>
      <stop offset="1" stop-color="#661913"/>
    </linearGradient>
    <linearGradient id="meatDark-gallery-toast" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#A8352B"/>

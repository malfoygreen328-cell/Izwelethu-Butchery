<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img">

  <defs>
    <linearGradient id="bg-gallery-toast" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#13100E"/>
      <stop offset="0.55" stop-color="#1C1714"/>
      <stop offset="1" stop-color="#0A0908"/>
    </linearGradient>
    <radialGradient id="key-gallery-toast" cx="0.5" cy="0.48999999999999994" r="0.62">
      <stop offset="0" stop-color="#DE5A1C" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#F7A03C" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#0A0908" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig-gallery-toast" cx="0.5" cy="0.48" r="0.78">
      <stop offset="0.45" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.72"/>
    </radialGradient>
    <linearGradient id="metal-gallery-toast" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8E4DE"/>

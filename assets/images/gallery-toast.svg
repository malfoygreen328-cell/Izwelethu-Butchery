      <path d="M-72 -40 L72 -40 L60 168 C56 206 -56 206 -60 168 Z" fill="#DE5A1C" opacity="0.72"/>
      <path d="M-84 -120 L84 -120 L80 -80 L-80 -80 Z" fill="#D9C7AC" opacity="0.6"/>
